spring:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CAMPUSMARKET_DB_URL:jdbc:mysql://localhost:3306/CampusMarket?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&useSSL=false}
    username: ${CAMPUSMARKET_DB_USER:root}
    password: ${CAMPUSMARKET_DB_PASSWORD:}
  session:
    timeout: 500m
server:
  port: ${CAMPUSMARKET_PORT:8099}
  servlet:
    session:
      timeout: 500m
mybatis-plus:
  mapper-locations: classpath*:mappers/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  type-aliases-package: com.west2.test6_4.entity
file:
  upload:
    path: ${CAMPUSMARKET_UPLOAD_PATH:./uploads/}
    allowTypes:
      - image/jpeg
      - image/png
      - image/jpg
      - image/bmp
